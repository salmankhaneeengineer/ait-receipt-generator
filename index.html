<script>
/* -------------------------------------------------
   Helper – restores original button markup after async work
   ------------------------------------------------- */
function restoreBtn(btn, originalHtml) {
  btn.innerHTML = originalHtml;
  btn.disabled = false;
}

/* -------------------------------------------------
   Generate receipt (unchanged, just a tiny tweak to
   force a re‑flow on the receipt wrapper)
   ------------------------------------------------- */
function generateReceipt() {
  const name   = document.getElementById('inp-name').value.trim();
  const cid    = document.getElementById('inp-cid').value.trim();
  const pppoe  = document.getElementById('inp-pppoe').value.trim();
  const agent  = document.getElementById('inp-agent').value.trim();
  const company= document.getElementById('inp-company').value.trim() || 'Amber IT';
  const web    = document.getElementById('inp-web').value.trim();
  const email  = document.getElementById('inp-email').value.trim();

  if (!name || !cid || !pppoe) {
    alert('Please fill in Customer Name, CID, and PPPoE Password.');
    return;
  }

  const ref = makeRef(cid);
  const now = new Date();
  const dateStr = new Intl.DateTimeFormat('en-GB', {
    day:'2-digit', month:'short', year:'numeric',
    hour:'2-digit', minute:'2-digit', hour12:false
  }).format(now);

  document.getElementById('r-company-name').textContent = company.toUpperCase();
  document.getElementById('r-web').textContent          = web;
  document.getElementById('r-email').textContent        = email;
  document.getElementById('r-avatar').textContent      = getInitials(name);
  document.getElementById('r-name').textContent        = name;
  document.getElementById('r-cid').textContent         = cid;
  document.getElementById('r-router-pass').textContent = 'aitcid' + cid;
  document.getElementById('r-pppoe-user').textContent   = cid;
  document.getElementById('r-pppoe-pass').textContent   = pppoe;
  document.getElementById('r-agent').textContent       = agent || 'Amber IT Staff';
  document.getElementById('r-date').textContent        = dateStr;
  document.getElementById('r-ref').textContent         = ref;
  document.getElementById('r-footer-ref').textContent    = 'Ref: ' + ref;

  // hide placeholder, show receipt
  document.getElementById('placeholder').style.display = 'none';
  const receipt = document.getElementById('receipt');
  receipt.classList.add('visible');
  receipt.style.display = 'block';
}

/* -------------------------------------------------
   Download receipt as PNG (fixed visibility check &
   restores original button markup)
   ------------------------------------------------- */
function downloadImage() {
  const receipt = document.getElementById('receipt');
  if (!receipt.classList.contains('visible')) {
    alert('Please generate a receipt first!');
    return;
  }

  const btn = document.getElementById('btn-dl');
  const originalHtml = btn.innerHTML;   // store SVG + text
  btn.innerHTML = 'Saving…';
  btn.disabled  = true;

  const card = document.getElementById('receipt-card');
  html2canvas(card, {
    scale: 2,
    useCORS: true,
    allowTaint: true,
    backgroundColor: '#ffffff',
    logging: false
  })
  .then(canvas => {
    const name = document.getElementById('r-name').textContent.replace(/\s+/g, '_');
    const cid  = document.getElementById('r-cid').textContent;
    const link = document.createElement('a');
    link.download = `AmberIT_Receipt_${name}_${cid}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    restoreBtn(btn, originalHtml);
  })
  .catch(err => {
    console.error(err);
    restoreBtn(btn, originalHtml);
    alert('Download failed – you can still use Print → Save as PDF.');
  });
}

/* -------------------------------------------------
   Tiny “reset” helper (nice to have)
   ------------------------------------------------- */
function resetForm() {
  document.getElementById('receipt').classList.remove('visible');
  document.getElementById('receipt').style.display = 'none';
  document.getElementById('placeholder').style.display = 'flex';
  // clear inputs – optional
  document.querySelectorAll('.form-panel input').forEach(i => i.value = '');
}

/* -------------------------------------------------
   Existing helpers (unchanged)
   ------------------------------------------------- */
function getInitials(name) {
  if (!name) return '??';
  return name.trim().split(/\s+/).map(w => w[0].toUpperCase()).slice(0,2).join('');
}
function makeRef(cid) {
  return 'AMB-' + cid + '-' + Date.now().toString().slice(-4);
}
</script>
